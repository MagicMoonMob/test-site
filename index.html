<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test App</title>
  <style>
    html, body {
      margin: 0;
    }
    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14122b;
      color: #f4f1ff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px 16px;
    }
    .logo {
      width: min(200px, 50vw, 35vh);
      height: auto;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
    }
    nav {
      align-self: flex-start;
      margin-left: 8vw;
      display: flex;
      gap: 20px;
    }
    nav a {
      color: #f4f1ff;
      text-decoration: none;
      font-size: 1.1rem;
    }
    nav a:hover {
      color: #ffd228;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Test App logo">
  <h1>Test App</h1>
  <nav>
    <a href="#">One</a>
    <a href="#">Two</a>
    <a href="#">Three</a>
  </nav>
</body>
</html>
